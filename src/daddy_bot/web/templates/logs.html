{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 mb-4">Live Logs</h1>

<div class="mb-4 flex items-center gap-4">
  <label class="text-sm font-medium text-gray-700">Filter level:</label>
  <select id="level-filter" class="rounded border-gray-300 text-sm">
    <option value="">All</option>
    <option value="DEBUG">DEBUG</option>
    <option value="INFO">INFO</option>
    <option value="WARNING">WARNING</option>
    <option value="ERROR">ERROR</option>
    <option value="CRITICAL">CRITICAL</option>
  </select>
  <button id="clear-btn" class="px-3 py-1 bg-gray-200 rounded text-sm hover:bg-gray-300">Clear</button>
</div>

<div id="log-container" class="bg-gray-900 text-green-400 font-mono text-xs rounded-lg p-4 h-[60vh] overflow-y-auto">
  {% for entry in recent_logs %}
  <div class="log-line" data-level="{{ entry.level }}">{{ entry.message }}</div>
  {% endfor %}
</div>

<script>
  const container = document.getElementById('log-container');
  const levelFilter = document.getElementById('level-filter');
  const clearBtn = document.getElementById('clear-btn');
  const es = new EventSource('/admin/logs/stream');

  function colorClass(level) {
    return { DEBUG: 'text-gray-400', INFO: 'text-green-400', WARNING: 'text-yellow-400',
             ERROR: 'text-red-400', CRITICAL: 'text-red-600' }[level] || 'text-green-400';
  }

  function applyFilter() {
    const val = levelFilter.value;
    document.querySelectorAll('#log-container .log-line').forEach(el => {
      el.style.display = (!val || el.dataset.level === val) ? '' : 'none';
    });
  }

  es.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.keep) return;
    const div = document.createElement('div');
    div.className = 'log-line ' + colorClass(data.level);
    div.dataset.level = data.level;
    div.textContent = data.message;
    const val = levelFilter.value;
    if (val && data.level !== val) div.style.display = 'none';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  };

  levelFilter.addEventListener('change', applyFilter);
  clearBtn.addEventListener('click', () => {
    container.querySelectorAll('.log-line').forEach(el => el.remove());
  });

  // Scroll to bottom on load
  container.scrollTop = container.scrollHeight;
</script>
{% endblock %}
