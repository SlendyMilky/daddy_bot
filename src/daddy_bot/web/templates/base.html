<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — Daddy Bot</title>
  <!-- Tailwind CDN (Play CDN for dev; production uses /admin/static/tailwind.css generated by Dockerfile) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="h-full">
  <div class="min-h-full">
    <nav class="bg-indigo-700">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <div class="flex items-center space-x-8">
            <span class="text-white font-bold text-lg">🤖 Daddy Bot Admin</span>
            <a href="/admin/" class="text-indigo-200 hover:text-white text-sm font-medium">Dashboard</a>
            <a href="/admin/chat" class="text-indigo-200 hover:text-white text-sm font-medium">💬 Chat</a>
            <a href="/admin/bibine" class="text-indigo-200 hover:text-white text-sm font-medium">Bibine</a>
            <a href="/admin/princesse" class="text-indigo-200 hover:text-white text-sm font-medium">Princesse</a>
            <a href="/admin/broadcast" class="text-indigo-200 hover:text-white text-sm font-medium">Broadcast</a>
            <a href="/admin/logs" class="text-indigo-200 hover:text-white text-sm font-medium">Logs</a>
            <a href="/admin/db" class="text-indigo-200 hover:text-white text-sm font-medium">DB</a>
          </div>
          <form method="post" action="/admin/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token|default('') }}">
            <button type="submit" class="text-indigo-200 hover:text-white text-sm">Logout</button>
          </form>
        </div>
      </div>
    </nav>
    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
