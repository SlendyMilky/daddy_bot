version: "3.8"

services:
  daddy-bot:
    image: ${DADDY_BOT_IMAGE:-ghcr.io/slendymilky/daddy_bot:latest}
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_START_MODEL: ${OPENAI_START_MODEL:-gpt-4.1-mini}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      RATE_LIMIT_MAX_EVENTS: ${RATE_LIMIT_MAX_EVENTS:-8}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
      RATE_LIMIT_COOLDOWN_MESSAGE: ${RATE_LIMIT_COOLDOWN_MESSAGE:-Doucement champion, respire 2 secondes et recommence.}
      OWNER_IDS: ${OWNER_IDS:-}
      BIBINE_CHANNEL_ID: ${BIBINE_CHANNEL_ID:-}
      BIBINE_TIMEZONE: ${BIBINE_TIMEZONE:-Europe/Paris}
      PRINCESSE_MORNING_ENABLED: ${PRINCESSE_MORNING_ENABLED:-true}
      PRINCESSE_MORNING_TIMEZONE: ${PRINCESSE_MORNING_TIMEZONE:-Europe/Paris}
      PRINCESSE_MORNING_START_HOUR: ${PRINCESSE_MORNING_START_HOUR:-6}
      PRINCESSE_MORNING_END_HOUR: ${PRINCESSE_MORNING_END_HOUR:-10}
      PRINCESSE_MORNING_SEND_CHANCE: ${PRINCESSE_MORNING_SEND_CHANCE:-0.05}
      PRINCESSE_MORNING_CHAT_IDS: ${PRINCESSE_MORNING_CHAT_IDS:-}
      # Admin web panel
      ADMIN_WEB_ENABLED: ${ADMIN_WEB_ENABLED:-true}
      ADMIN_WEB_PORT: ${ADMIN_WEB_PORT:-8080}
      ADMIN_WEB_PUBLIC_URL: ${ADMIN_WEB_PUBLIC_URL:-http://localhost:8080}
      ADMIN_WEB_SECRET_KEY: ${ADMIN_WEB_SECRET_KEY:-}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-168}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
      TELEGRAM_OIDC_DISCOVERY_URL: ${TELEGRAM_OIDC_DISCOVERY_URL:-https://oauth.telegram.org/.well-known/openid-configuration}
    ports:
      - "${ADMIN_WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volume removed: ./data bind mount is now used instead (see volumes above).
# If you previously used a named volume, migrate data before switching:
#   docker run --rm -v daddy_bot_data:/src -v $(pwd)/data:/dst alpine cp -a /src/. /dst/
